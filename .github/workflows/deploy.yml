# ====================================================================
# GitHub Actions pipeline - deploy to AWS ECS Fargate
# ====================================================================

name: Deploy to Amazon ECS

on:
    push:
        branches: [
            -master
        ]

env:
    AWS_REGION: "us-east-1"
    ECS_REPOSITORY: "dev-app-repo"
    ECS_SERVICE: "dev-app-service"
    ECS_CLUSTER: "dev-app-cluster"
    ECS_TASK_DEFINITION: "dev-app-task-def"
    ECS_CONTAINER_NAME: "dev-app-container"

jobs:
    deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        
        steps:
            # 1. Clone Repository
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Configure AWS Credentials
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}

            # 3. Login to Amazon ECR
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            # 4. Build and Push Docker Image to Amazon ECR
            - name: Build, Tag and Push Docker image to Amazon ECR
              id: build-image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                # compile the container using Dockerfile in /app folder 
                docker build -t $ECR_REGISTRY/$ECS_REPOSITORY:$IMAGE_TAG .
                # uploading the image to private repo of AWS ECR
                docker push $ECR_REGISTRY/$ECS_REPOSITORY:$IMAGE_TAG
                # Safe the URI of the Image in the Output for use it in the next step
                echo "image=$ECR_REGISTRY/$ECS_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

            # 5. Download Task Definition
            - name: Download Task Definition from AWS
              run: |
                aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

            # 6. Replace Task Definition with Image URI
            - name: Replace Image URI in Task Definition
              id: render-task-def
              uses: aws-actions/render-task-definition@v1
              with:
                task-definition: task-definition.json
                container-name: ${{ env.ECS_CONTAINER_NAME }}
                image: ${{ steps.build-image.outputs.image }}

            # 7. Deploy the task definition to ECS Fargate
            - name: Deploy Amazon ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-task-def.outputs.task-definition }}
                service: ${{ env.ECS_SERVICE }}
                cluster: ${{ env.ECS_CLUSTER }}
                wait-for-service-stability: true
            
              
              
            

         
    