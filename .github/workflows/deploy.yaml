# ====================================================================
# GitHub Actions pipeline - deploy to AWS ECS Fargate
# ====================================================================

name: Deploy to Amazon ECS & EKS

on:
  push:
    branches:
      - "feature/*"
    tags:
      - "v*.*.*" 
env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "dev-app-repo"

  # ECS Variables
  ECS_SERVICE: "dev-app-service"
  ECS_CLUSTER: "dev-main-cluster"
  ECS_TASK_DEFINITION: "dev-app-task"
  ECS_CONTAINER_NAME: "dev-app-container"

  # EKS Variables
  EKS_CLUSTER: "dev-eks"

jobs:
  deploy:
    name: Build and Deploy to ECS & EKS
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clone Repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and Push Docker Image to Amazon ECR
      - name: Build, Tag and Push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        
        run: |
          # If the event is a Tag (ej. v1.0.0), we use that tag for ECR. If it is a common push, we use 'latest' or the SHA.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
          else
            IMAGE_TAG="latest"
          fi
          
          # Build IMAGE using Dockerfile provided in the app folder
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          
          # Push IMAGE to AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 5. Download Task Definition (ONLY RUN IF IT IS A VERSION TAG)
      # This avoids making deployments in intermediate development commits
      - name: Download Task Definition from AWS
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      # 6. Replace Task Definition with Image URI (ONLY RUN IF IT IS A VERSION TAG)
      - name: Replace Image URI in Task Definition
        if: startsWith(github.ref, 'refs/tags/v')
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 7. Deploy the task definition (ONLY RUN IF IT IS A VERSION TAG) 
      - name: Deploy Amazon ECS task definition
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

# ====================================================================
# Deploy Tier 2: Amazon EKS KUBERNETES (ONLY RUN IF IT IS A VERSION TAG)
# ====================================================================

      # 8. Install kubectl in the runner of GitHu
      - name: Install kubectl
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/setup-kubectl@v3
      
      # 9. Connecting to EKS Cluster
      - name: Update kubeconfigfor EKS
        if: startsWith(github.ref, 'refs/tags/v')
        run: | 
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      # 10. Replace image tag and deploy kubernetes manifest
      - name: Deploy to AWS EKS 
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: | 
            sed -i "s|image:.*|image: $IMAGE_URI|g" ./k8s/deployment.yaml
            kubectl apply -f k8s/
