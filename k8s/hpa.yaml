# ====================================================================
# Manifest of Kubernetes Horizontal Pod Autoscaler
# ====================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-dashboard-hpa
  namespace: devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-dashboard
  minReplicas: 1 # Minimum number of pods
  maxReplicas: 2 # Maximum number of pods
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50