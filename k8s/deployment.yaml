# ====================================================================
# Manifest of Kubernetes Deployment
# ====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-dashboard
  namespace: devops
  labels:
    app: devops-dashboard
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-dashboard
  template:
    metadata:
      labels:
        app: devops-dashboard
        environment: dev
    spec:
      containers:
      - name: app-container
        image: devops-dashboard
        imagePullPolicy: Always    
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100Mi"
            memory: "128Mi"
          limits:
            cpu: "250Mi"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10